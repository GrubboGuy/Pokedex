name: Build issue and publish

on:
  schedule:
    # Morning runs: refresh the picks so they are ready by 7:00 AM US Eastern.
    # GitHub starts scheduled runs late on this repo (the first one arrived over three hours late), so the
    # first run is set for 06:10 UTC (2:10 AM Eastern daylight time, 1:10 AM in winter), leaving about five
    # hours of slack. The price feed only changes once a day, around 20:00 UTC, so running early loses nothing.
    # A second run at 08:40 UTC covers a first run that GitHub drops; if both happen the second repeats the first.
    - cron: "10 6 * * *"
    - cron: "40 8 * * *"
    # Evening run: saves the day's prices soon after TCGCSV's refresh at about 20:00 UTC. Does not change the picks.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      cut:
        description: "Picks: auto (refresh if prices are newer), force (re-pick now), new (start the next numbered issue), never"
        type: choice
        options: [auto, force, new, never]
        default: auto
  push:
    branches: [main]
    paths: ["web/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: issue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore saved data
        run: |
          mkdir -p _data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _data_clone
            rm -rf _data_clone/.git
            cp -a _data_clone/. _data/
            rm -rf _data_clone
          fi
          ls _data || true

      - name: Run the data job
        env:
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
          POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -o pipefail
          CUT="${{ inputs.cut || 'auto' }}"
          # Only the morning runs and manual runs change the picks. The evening run and code pushes leave them alone,
          # unless a push's commit message contains [cut issue], which re-picks the lists now.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 21 * * *" ]; then CUT=never; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            CUT=never
            if printf '%s' "$COMMIT_MESSAGE" | grep -q '\[cut issue\]'; then CUT=force; fi
            # [new issue] starts the next numbered issue, if prices are newer than the last one.
            if printf '%s' "$COMMIT_MESSAGE" | grep -q '\[new issue\]'; then CUT=new; fi
          fi
          mkdir -p _site/data
          python -m pipeline.run --data-dir _data --site-dir _site/data --cut "$CUT" 2>&1 | tee _data/last-run.log

      - name: Save data
        if: always()
        run: |
          echo "run ${{ github.run_id }} on ${{ github.sha }} finished $(date -u +%FT%TZ), job status: ${{ job.status }}" >> _data/last-run.log
          cd _data
          git init --quiet -b data
          git config user.name "issue-bot"
          git config user.email "issue-bot@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Data as of $(date -u +%F)"
          git push --quiet --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp -a web/. _site/
          cp _data/issues/*.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
